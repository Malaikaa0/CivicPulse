# A Deployment for PostgreSQL is a marked spec error - a StatefulSet gives it a stable network
# identity and, via volumeClaimTemplates, a PVC that survives the pod being rescheduled or
# deleted, which a Deployment's shared/ephemeral storage model does not guarantee the same way.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: civicpulse
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: civicpulse-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "civicpulse"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "civicpulse"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Headless, matching the StatefulSet's serviceName - gives postgres-0 a stable DNS name and is
# what StatefulSet networking expects. type: ClusterIP + clusterIP: None (a headless Service is
# still a ClusterIP Service, just without a virtual IP) - never NodePort/LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: civicpulse
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
