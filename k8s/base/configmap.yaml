# Non-secret configuration only. Anything with a password or key lives in secret.yaml instead -
# see spec 5.3's automatic deduction for an LLM key in a manifest, even base64-encoded.
apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
  namespace: civicpulse
data:
  POSTGRES_USER: "civicpulse"
  POSTGRES_DB: "civicpulse"
  REDIS_URL: "redis://redis:6379/0"
  TRIAGE_PROVIDER: "simulated"
  TRIAGE_TIMEOUT_SECONDS: "10"
  TRIAGE_CACHE_TTL_SECONDS: "86400"
  LLM_VENDOR: "gemini"
  GEMINI_MODEL: "gemini-3.5-flash-lite"
  STATS_CACHE_TTL_SECONDS: "30"
  RATE_LIMIT_REQUESTS: "10"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  TRUST_FORWARDED_FOR: "false"
  LOG_LEVEL: "INFO"
