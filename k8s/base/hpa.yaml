# Backend only, per spec 3.3. Scale-out is immediate (users are waiting); scale-in is slow
# (flapping - repeatedly scaling down then back up under bursty load - is expensive, both in
# disruption and in the cold-start cost paid on every scale-out).
#
# This only works because backend.yaml sets resources.requests.cpu: the HPA computes
# utilisation as usage/request: with no request, there is no denominator and this sits at
# <unknown>/60% forever.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: civicpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
