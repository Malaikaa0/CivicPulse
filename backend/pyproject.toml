[project]
name = "civicpulse-backend"
version = "0.1.0"
description = "CivicPulse municipal complaint intake and triage API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]

[tool.ruff.lint.isort]
# Our own alembic/ directory would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: needs a real PostgreSQL; skipped unless TEST_DATABASE_URL is set"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 65
show_missing = true
