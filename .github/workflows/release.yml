name: release

# spec 3.4: on tag v* - build, push semver tags, generate release notes. A tag is pushed after
# main has already gone through cd.yml on the merge that produced it, so this does not re-run the
# full test suite - it packages and publishes what was already tested and deployed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub Release

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend

jobs:
  build-push-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From tag v1.2.3, produces 1.2.3, 1.2, 1 - the standard semver tag family, on top of the
      # commit-SHA tag every merge to main already got from cd.yml. Deployments still reference
      # the SHA (spec 3.4 non-negotiable); these tags are for humans and other tools pulling a
      # specific released version by name.
      - name: Metadata - backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Metadata - frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push backend
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  github-release:
    needs: build-push-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so auto-generated notes can diff against the previous tag

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Images: \`${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}\` (digest \`${{ needs.build-push-tag.outputs.backend-digest }}\`), \`${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}\` (digest \`${{ needs.build-push-tag.outputs.frontend-digest }}\`)"
