server {
    # Non-root nginx can't bind <1024; see the Dockerfile for why this is 8080, not 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ADR-0002: the frontend never knows the backend's address. nginx is the only thing that
    # does, via the service name Compose/Kubernetes gives it, so one built image runs unchanged
    # in every environment - no rebuild, no baked-in URL, no /config.js.
    #
    # The upstream is a variable, not a bare hostname, on purpose: a plain `proxy_pass
    # http://backend:8000` resolves DNS once when nginx starts and REFUSES TO START if that
    # fails - a real risk here, since nothing guarantees the backend's DNS entry exists before
    # the frontend container does. Docker's embedded DNS (127.0.0.11) plus a variable makes
    # nginx resolve lazily per request instead: it starts regardless of dependency ordering, and
    # a still-starting backend is a 502 on that one request, not a crashed frontend.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No path after the variable: the backend's own routes already include the /api prefix
        # (e.g. APIRouter(prefix="/api/complaints")), so the request URI is forwarded unchanged.
        # (A variable in proxy_pass disables nginx's usual prefix-rewrite, which is exactly what
        # is wanted here - adding a path after the variable would rewrite it into the wrong URI.)
        set $backend "http://backend:8000";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
