# Development stack. compose.prod.yaml is the deployable counterpart: no build:, pinned
# image: tags, no published database/cache ports.
#
# Network segmentation (spec 3.2): frontend can never reach postgres or redis directly. Only
# backend bridges edge and internal, because it is the one service both sides need to talk to.
#   docker compose exec frontend ping database   -> must fail (no route: different network,
#                                                    and internal:true blocks anything outside
#                                                    the two networks Docker composes for it)
#   docker compose exec frontend wget backend:8000/health -> works (both join edge)
networks:
  edge: # frontend <-> backend
    driver: bridge
  internal: # backend <-> postgres <-> redis; no route to the outside world
    driver: bridge
    internal: true

volumes:
  pgdata: # PostgreSQL's data directory. The durable one: this is the system of record.
  redisdata: # AOF persistence. See docs/ENGINEERING-NOTES.md ("E4") for why a cache has this.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port here, and this is not an oversight: a container whose only network is
    # internal: true cannot be reached from the host at all, published port or not - that is
    # what internal: true means, and it is required for network segmentation (spec 3.2). Host-
    # side access is `docker compose exec postgres psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    image: redis:7
    restart: unless-stopped
    networks: [internal]
    # AOF on: see docs/ENGINEERING-NOTES.md for why a cache is given persistence at all.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # Same reasoning as postgres: no published port, because internal: true makes one
    # unreachable regardless. Host-side access is `docker compose exec redis redis-cli`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # One-shot: brings the schema to head, then exits. Idempotent, so it is safe on every `up`,
  # not only the first. This is what "no CREATE TABLE in application startup code" (spec 2.3)
  # is contrasted with: a migration is a reviewable, versioned step, run deliberately, not a
  # side effect of the app booting.
  migrate:
    build: ./backend
    networks: [internal]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # One-shot: idempotent seed (see backend/app/seed.py). Satisfies "one command, running with
  # seeded data" (spec 1.4) without a manual step after `up`.
  seed:
    build: ./backend
    networks: [internal]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.seed"]
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    networks: [edge, internal] # the only service that bridges both
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER}
      TRIAGE_TIMEOUT_SECONDS: ${TRIAGE_TIMEOUT_SECONDS}
      TRIAGE_CACHE_TTL_SECONDS: ${TRIAGE_CACHE_TTL_SECONDS}
      LLM_VENDOR: ${LLM_VENDOR}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      STATS_CACHE_TTL_SECONDS: ${STATS_CACHE_TTL_SECONDS}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8000:8000" # dev convenience (direct curl/OpenAPI docs); not published in prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    # Dev-only hot reload: the image's own code is replaced by the live source tree, and
    # --reload restarts the app on save. Right here, wrong in compose.prod.yaml: production
    # must run the exact image that was built and scanned, not a live mount of whatever the
    # host's working tree happens to contain.
    volumes:
      - ./backend/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [edge] # never internal: the frontend has no route to postgres or redis
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
